name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.9

    - name: Build Debug APK with Gradle
      run: gradle assembleDebug --stacktrace

    - name: Rename APK for Easy Identification
      run: cp app/build/outputs/apk/debug/app-debug.apk ReelLimiter.apk

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ReelLimiter-APK
        path: ReelLimiter.apk
        retention-days: 30

    - name: Publish to GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.4
        name: "ReelLimiter v1.0.4"
        body: |
          ### 📱 ReelLimiter APK Download
          Direct download for your Pixel phone:
          - Download **`ReelLimiter.apk`** below under **Assets**.
          
          #### What's in this version:
          - ⏱️ Limits Instagram Reels viewing to a daily maximum of 20 minutes.
          - 💬 DMs, Stories, and Feeds remain fully accessible.
          - 🎨 Dynamic Material 3 (Material You) theme matching your Pixel wallpaper.
          - 🔔 Subtle vibration & overlay reminder when daily limit is reached.
        files: ReelLimiter.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
